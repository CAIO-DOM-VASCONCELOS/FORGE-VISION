name: Assemble production artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-production.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct FORGE VISION V3.3 FULL
        run: |
          cat \
            build_parts/index.part00.b64 \
            build_parts/index.part01.b64 \
            build_parts/index.part02a.b64 \
            build_parts/index.part02b0.b64 \
            build_parts/index.part02b1.b64 \
            build_parts/index.part02b2.b64 \
            build_parts/index.part02b3.b64 \
            | base64 -d \
            | gunzip > index.html
          test "$(wc -c < index.html)" -eq 86711
          echo "4baa947df5439d33c1d5ddd9fbb03e919aee63e2087559f734d0ab640620241e  index.html" | sha256sum -c -

      - name: Validate production application
        run: |
          python scripts/validate_static.py
          node --check .tmp-inline-script.js
          node --test tests/inventory_math.test.mjs
          rm -f .tmp-inline-script.js

      - name: Publish production artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r build_parts
          git commit -m "chore: publish FORGE VISION V3.3 FULL production artifact"
          git push
